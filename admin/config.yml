
backend:
  name: github
  repo: kamila11441/jakyb11-monodraft
  branch: main

media_folder: "images"
public_folder: "/images"

site_url: ""
display_url: ""

collections:
  - name: "portfolio"
    label: "Portfolio"
    files:
      - name: "gallery"
        label: "Photo Gallery"
        file: "content/gallery.json"
        format: "json"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.category}} — {{fields.alt}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt text", name: "alt", widget: "string", required: false }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "People", value: "people" }
                  - { label: "Places", value: "places" }
                  - { label: "Fashion", value: "fashion" }
                  - { label: "Other", value: "other" }
